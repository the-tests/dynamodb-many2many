name: dynamotest

networks:
  dynamotest:
    name: dynamotest
    ipam:
      driver: default
      config:
        - subnet: "10.0.117.32/29"

services:
  dynamodb:
    container_name: ddb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    image: "amazon/dynamodb-local:2.5.4"
    # mounted folder doesn't work with non-root users if it created automatically by docker
    user: 0:0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 2>/dev/null; if [ $$? -eq 22 ]; then exit 0; else exit 1; fi"]
      interval: 15s
      timeout: 4s
      retries: 2
      start_period: 1s
    ports:
      - "5005:8000"
    # add volume to store data permanently even if container was removed
    volumes:
      - ./mounted_data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal
    networks:
      dynamotest:
        aliases:
          - ddb
          - dynamo
          - dynamodb

  dynamodb-admin:
    container_name: ddba
    image: aaronshaf/dynamodb-admin:latest
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      - DYNAMO_ENDPOINT=http://ddb:8000
      - PORT=8000
      - HOST=0.0.0.0
    ports:
      - "8000:8000"
    networks:
      - dynamotest
